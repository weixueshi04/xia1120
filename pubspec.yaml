name: xiaapp
description: 夏同龢数字人AI助手 - 助力少数民族地区教育均衡
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  lottie: ^3.1.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.9.0
  http: ^1.2.0
  dio: ^5.4.0
  record: ^6.1.2 
  audioplayers: ^5.2.1    # 音频播放
  shared_preferences: ^2.2.2
  json_annotation: ^4.8.1
  collection: ^1.18.0
  crypto: ^3.0.7
  archive: ^3.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.8
  flutter_launcher_icons: "^0.13.1" # ⬅️ 确保这个依赖在dev_dependencies下

flutter:
  uses-material-design: true
  
  assets:
    - assets/lottie/
    - assets/data/
    - assets/images/

# ⬅️ 注意！flutter_launcher_icons: 这一行必须和 flutter: 这一行对齐
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/launcher_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/launcher_icon.png"
    background_color: "#1A4D7A"
    theme_color: "#1A4D7A"
  windows:
    generate: true
    image_path: "assets/images/launcher_icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/launcher_icon.png"
